name: Promover versión estable
on:
  workflow_dispatch:
    inputs:
      version:
        description: Etiqueta de la versión validada, por ejemplo v0.3.0
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: local
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node scripts/check-version.mjs "$RELEASE_TAG"
      - run: npm test
      - run: npm run check:security
      - run: npm audit --audit-level=high
      - name: Registrar Chrome incluido en la imagen de GitHub
        run: google-chrome --version
      - run: npm run test:e2e
      - run: node scripts/prepare-pages.mjs production
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-production
          path: .build/candidate
          retention-days: 30
  approval:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - run: echo 'Aprobación del responsable registrada en GitHub.'
  publish:
    needs: [prepare, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://javidez89.github.io/margaret-pos/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-production
          path: .build/candidate
      - name: Exigir QA del mismo código y preparar solo producción
        run: node scripts/assemble-site.mjs production
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - run: node scripts/smoke-site.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-publication
          path: .artifacts/publication.json
          retention-days: 90
