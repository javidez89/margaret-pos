name: Preparar versión
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta exacta de package.json, por ejemplo v0.2.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-version
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    env:
      APP_ENV: local
      RELEASE_TAG: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exigir origen main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verificar etiqueta y paquete
        run: node scripts/check-version.mjs "$RELEASE_TAG"
      - run: npm test
      - name: Verificar fuente generada
        run: git diff --exit-code -- demo/index.html
      - name: Preparar archivos e integridad
        run: node scripts/package-release.mjs "$RELEASE_TAG"
      - name: Rechazar una etiqueta ya existente
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "La versión ya existe. No se sobrescriben etiquetas."
            exit 1
          fi
      - name: Crear etiqueta inmutable por convención
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Margaret $RELEASE_TAG - versión para pruebas" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Crear borrador de versión preliminar
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --prerelease \
            --title "Margaret $RELEASE_TAG · Pruebas" \
            --notes-file ".artifacts/releases/$RELEASE_TAG/release-notes.md" \
            ".artifacts/releases/$RELEASE_TAG/margaret-$RELEASE_TAG-demo.zip" \
            ".artifacts/releases/$RELEASE_TAG/release-metadata.json" \
            ".artifacts/releases/$RELEASE_TAG/SHA256SUMS"
